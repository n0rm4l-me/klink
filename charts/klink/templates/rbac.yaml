apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "klink.fullname" . }}-manager
  labels:
    {{- include "klink.labels" . | nindent 4 }}
rules:
- apiGroups: ["deps.klink.dev"]
  resources: ["workloaddependencies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["deps.klink.dev"]
  resources: ["workloaddependencies/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["deps.klink.dev"]
  resources: ["workloaddependencies/finalizers"]
  verbs: ["update"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["argoproj.io"]
  resources: ["rollouts"]
  verbs: ["get", "list", "watch", "update", "patch"]
{{- if .Values.gateWebhook.enabled }}
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingwebhookconfigurations"]
  verbs: ["get", "patch"]
  resourceNames: ["klink-gate", "klink-wd-validator"]
{{- end }}
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
{{- if .Values.leaderElection.enabled }}
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
{{- if .Values.gateWebhook.enabled }}
---
# Namespaced Role for TLS secret — more restrictive than ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "klink.fullname" . }}-webhook-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "klink.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update"]
  resourceNames: ["klink-webhook-tls"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "klink.fullname" . }}-webhook-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "klink.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "klink.fullname" . }}-webhook-secret
subjects:
- kind: ServiceAccount
  name: {{ include "klink.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "klink.fullname" . }}-manager
  labels:
    {{- include "klink.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "klink.fullname" . }}-manager
subjects:
- kind: ServiceAccount
  name: {{ include "klink.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
