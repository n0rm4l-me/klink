{{- $webhookEnabled := or .Values.gateWebhook.enabled .Values.wdValidation.enabled }}
{{- if $webhookEnabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: klink-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "klink.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "klink.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
{{- end }}

{{- if .Values.gateWebhook.enabled }}
---
# Gate webhook — blocks scale-up of workloads when dependencies are unhealthy.
# failurePolicy: Ignore — never block workloads if webhook is down.
# NOTE: Not supported on GKE Autopilot (platform limitation). Use strict mode instead.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: klink-gate
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "klink.labels" . | nindent 4 }}
webhooks:
  - name: gate.klink.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore  # fail open — never block workloads if webhook is down
    matchPolicy: Equivalent
    rules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale"]
        operations: ["CREATE", "UPDATE"]
        scope: Namespaced
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        resources: ["rollouts"]
        operations: ["CREATE", "UPDATE"]
        scope: Namespaced
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        resources: ["cronjobs"]
        operations: ["CREATE", "UPDATE"]
        scope: Namespaced
    clientConfig:
      service:
        name: klink-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 443
      # caBundle is patched automatically by the operator at startup
      caBundle: ""
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "klink-system"]
{{- end }}

{{- if .Values.wdValidation.enabled }}
---
# WorkloadDependency validator — validates WD resources on CREATE/UPDATE.
# Enabled independently of gate mode. Recommended: always on.
# failurePolicy: Fail ensures invalid WDs are rejected at admission time.
# timeoutSeconds: 10 — default k8s webhook timeout is sufficient.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: klink-wd-validator
  labels:
    {{- include "klink.labels" . | nindent 4 }}
webhooks:
  - name: validate.workloaddependency.klink.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    rules:
      - apiGroups: ["deps.klink.dev"]
        apiVersions: ["v1alpha1"]
        resources: ["workloaddependencies"]
        operations: ["CREATE", "UPDATE"]
        scope: Namespaced
    clientConfig:
      service:
        name: klink-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-wd
        port: 443
      # caBundle is patched automatically by the operator at startup
      caBundle: ""
{{- end }}
