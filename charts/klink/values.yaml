replicaCount: 1

image:
  repository: ghcr.io/n0rm4l-me/klink
  pullPolicy: Always
  tag: ""  # defaults to Chart.appVersion

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

leaderElection:
  enabled: true

gateWebhook:
  enabled: false   # set to true to enable gate mode admission webhook

metrics:
  enabled: true
  port: 8080     # plain HTTP metrics endpoint for Prometheus scraping

nodeSelector: {}
tolerations: []
affinity: {}
