name: Tests

on:
  push:
  pull_request:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    permissions:
      contents: read
      checks: write
      security-events: write  # for anchore scan-action to upload results
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check manifests are up to date
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.1
          controller-gen rbac:roleName=manager-role crd paths="./..." output:crd:artifacts:config=testdata/crd
          cp testdata/crd/deps.klink.dev_workloaddependencies.yaml charts/klink/templates/crd.yaml
          git diff --exit-code testdata/crd/deps.klink.dev_workloaddependencies.yaml charts/klink/templates/crd.yaml || \
            (echo "CRD manifests are out of date. Run 'make manifests' and commit." && exit 1)

      - name: Run unit tests (webhook)
        run: |
          gotestsum \
            --format github-actions \
            --junitfile /tmp/unit-junit.xml \
            -- ./internal/webhook/... -timeout 60s

      - name: Cache envtest binaries
        uses: actions/cache@v4
        with:
          path: /home/runner/.local/share/kubebuilder-envtest
          key: envtest-1.33-${{ runner.os }}-${{ runner.arch }}

      - name: Install setup-envtest
        run: |
          GOBIN=$HOME/.local/bin go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run integration tests (envtest)
        run: |
          ENVTEST_ASSETS=$(setup-envtest use 1.33 -p path)
          KUBEBUILDER_ASSETS=$ENVTEST_ASSETS gotestsum \
            --format github-actions \
            --junitfile /tmp/integration-junit.xml \
            -- ./internal/controller/... -timeout 300s

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '/tmp/*-junit.xml'
          check_name: Test Results
          include_passed: true
          detailed_summary: true

      - name: Generate SBOM from source (go.mod)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          artifact-name: sbom-${{ github.sha }}.spdx.json

      - name: Scan SBOM for vulnerabilities
        uses: anchore/scan-action@v5
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table
