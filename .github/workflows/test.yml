name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5.5.1
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check manifests are up to date
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.1
          controller-gen rbac:roleName=manager-role crd paths="./..." output:crd:artifacts:config=testdata/crd
          cp testdata/crd/deps.klink.dev_workloaddependencies.yaml charts/klink/templates/crd.yaml
          git diff --exit-code testdata/crd/deps.klink.dev_workloaddependencies.yaml charts/klink/templates/crd.yaml || \
            (echo "CRD manifests are out of date. Run 'make manifests' and commit." && exit 1)

      - name: Run unit tests (webhook, no cluster)
        run: go test ./internal/webhook/... -timeout 30s

      - name: Run integration tests (envtest)
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          ENVTEST_ASSETS=$(setup-envtest use 1.33 -p path)
          KUBEBUILDER_ASSETS=$ENVTEST_ASSETS go test ./internal/controller/... -timeout 120s
