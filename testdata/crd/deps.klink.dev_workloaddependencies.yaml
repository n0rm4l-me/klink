---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: workloaddependencies.deps.klink.dev
spec:
  group: deps.klink.dev
  names:
    kind: WorkloadDependency
    listKind: WorkloadDependencyList
    plural: workloaddependencies
    singular: workloaddependency
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.savedReplicas
      name: Replicas
      type: integer
    - jsonPath: .status.message
      name: Message
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkloadDependencySpec defines the desired behavior of the
              dependency relationship.
            properties:
              dependent:
                description: WorkloadRef identifies a workload in the cluster.
                properties:
                  kind:
                    enum:
                    - Deployment
                    - StatefulSet
                    - CronJob
                    - Rollout
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - kind
                - name
                type: object
              dependsOn:
                items:
                  description: DependsOnEntry describes a single dependency to watch.
                  properties:
                    condition:
                      description: HealthCondition defines thresholds and timing for
                        dependency health checks.
                      properties:
                        minReadyPercent:
                          default: 100
                          description: Minimum percentage of ready replicas to consider
                            the workload healthy.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                        recoveryWindow:
                          default: 60s
                          description: How long the dependency must be healthy before
                            restoring replicas.
                          type: string
                        window:
                          default: 30s
                          description: How long the dependency must be unhealthy before
                            action is taken.
                          type: string
                      type: object
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              mode:
                default: strict
                enum:
                - strict
                - soft
                - gate
                - observe
                type: string
              notify:
                description: NotifySpec configures webhook notifications on phase
                  transitions.
                properties:
                  onPhases:
                    description: |-
                      OnPhases lists which phase transitions trigger a notification.
                      Defaults to ["Suspended", "Healthy"] if empty.
                    items:
                      enum:
                      - Healthy
                      - Degraded
                      - Suspended
                      - Paused
                      - Observed
                      - Unknown
                      type: string
                    type: array
                  webhook:
                    description: Webhook is the URL to POST phase change notifications
                      to.
                    type: string
                  webhookSecretRef:
                    description: |-
                      WebhookSecretRef references a Secret containing the webhook URL under key "url".
                      Takes precedence over Webhook if set.
                    properties:
                      key:
                        default: url
                        type: string
                      name:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              onDegraded:
                description: OnDegradedSpec defines what action to take when a dependency
                  is unhealthy.
                properties:
                  action:
                    default: ScaleToZero
                    enum:
                    - ScaleToZero
                    type: string
                  maxSuspendDuration:
                    description: |-
                      MaxSuspendDuration is the maximum time the dependent workload can remain suspended.
                      After this duration klink will restore the workload even if the dependency is still unhealthy.
                      Zero means suspend indefinitely. Example: "4h", "30m".
                    type: string
                type: object
            required:
            - dependent
            - dependsOn
            type: object
          status:
            description: WorkloadDependencyStatus is the observed state of a WorkloadDependency.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              degradedSince:
                description: Timestamp when the dependency first became unhealthy
                  (for hysteresis window).
                format: date-time
                type: string
              healthySince:
                description: Timestamp when the dependency first became healthy again
                  (for recovery window).
                format: date-time
                type: string
              message:
                description: Human-readable message about the current state.
                type: string
              phase:
                description: Current phase of the dependency.
                enum:
                - Healthy
                - Degraded
                - Suspended
                - Paused
                - Observed
                - Unknown
                type: string
              savedReplicas:
                description: Saved replica count before scale-to-zero, used for restore.
                format: int32
                type: integer
              suspendedAt:
                description: Timestamp when the dependent workload was suspended (for
                  maxSuspendDuration).
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
